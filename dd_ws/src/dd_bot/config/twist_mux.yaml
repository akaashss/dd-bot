twist_mux:
  ros__parameters:
    use_stamped: false       
    allow_initial_zero: true # Set initial velocity to zero 
    topics:
      teleop:
        topic: cmd_vel_teleop
        timeout: 0.5
        priority: 100
      navigation:
        topic: cmd_vel
        timeout: 0.5
        priority: 10
      tracker:
        topic: cmd_vel_tracker
        timeout: 0.5
        priority: 20
